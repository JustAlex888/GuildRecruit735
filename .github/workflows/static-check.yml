name: Lua 5.1 and static checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Native Lua 5.1 parse
        run: for file in GuildRecruit735/*.lua; do luac5.1 -p "$file"; done
      - name: Russian and English regression
        run: |
          lua5.1 tests/test_runtime.lua GuildRecruit735 ru tests/test_docking.lua
          lua5.1 tests/test_runtime.lua GuildRecruit735 en tests/test_docking.lua
      - name: Verify deterministic packaging
        run: |
          python3 tools/build.py
          python3 tools/validate.py

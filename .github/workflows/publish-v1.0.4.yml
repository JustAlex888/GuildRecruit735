name: Publish GuildRecruit735 1.0.4

# Explicitly authorized one-time stable release; existing releases stay intact.
on:
  push:
    branches: [main]
    paths:
      - 'GuildRecruit735/Core.lua'
      - '.github/workflows/publish-v1.0.4.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'JustAlex888/GuildRecruit735'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Verify exact release and deterministic install asset
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VERSION = "1.0.4"' GuildRecruit735/Core.lua
          grep -q 'BUILD = "GR735-20261015-04"' GuildRecruit735/Core.lua
          grep -q '^## Version: 1.0.4$' GuildRecruit735/GuildRecruit735.toc
          grep -q '^## X-Build: GR735-20261015-04$' GuildRecruit735/GuildRecruit735.toc
          for file in GuildRecruit735/*.lua; do luac5.1 -p "$file"; done
          lua5.1 tests/test_runtime.lua GuildRecruit735 ru tests/test_docking.lua
          lua5.1 tests/test_runtime.lua GuildRecruit735 en tests/test_docking.lua
          python3 tools/build.py
          python3 tools/validate.py
          echo '63280fc9faa5b21dd72a77a1ca420467b7a8e22d8a527135e8e38941056b3874  dist/GuildRecruit735-1.0.4-GR735-20261015-04.zip' | sha256sum -c -
          test "$(unzip -Z1 dist/GuildRecruit735-1.0.4-GR735-20261015-04.zip | wc -l)" -eq 11
      - name: Publish stable release and exact installation ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.4 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create v1.0.4 \
            dist/GuildRecruit735-1.0.4-GR735-20261015-04.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'GuildRecruit735 1.0.4' \
            --notes-file docs/RELEASE_NOTES_RU.md \
            --latest
